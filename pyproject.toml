[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k3-day08-rag-pipeline"
version = "0.1.0"
description = "Day 8 group lab for building and evaluating a RAG pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "anthropic>=0.40.0",
    "chromadb>=0.5.0",
    "crawl4ai>=0.3.0",
    "datasets>=2.14.0",
    "fpdf2>=2.7.0",
    "google-genai>=1.0.0",
    "langchain-openai>=0.1.0",
    "langchain-text-splitters>=0.2.0",
    "markitdown[pdf]>=0.1.0",
    "numpy>=1.24.0",
    "openai>=1.30.0",
    "pageindex>=0.1.0",
    "python-dotenv>=1.0.0",
    "ragas==0.1.21",
    "rank-bm25>=0.2.2",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

